name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node --check teddycloud-card.js
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: npm test
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
